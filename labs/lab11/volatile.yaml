# ============================================================
# Lab 11, étape 1 (facultative) — emptyDir : un dossier qui vit autant que le POD.
# Il survit au redémarrage du conteneur, pas à la suppression du pod.
# ============================================================
apiVersion: v1
kind: Pod
metadata:
  name: volatile
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile: {type: RuntimeDefault}
  containers:
  - name: volatile
    image: busybox:1.37
    # Une ligne par démarrage, puis attente. sh est le PID 1 du conteneur : sans « trap »,
    # il ignorerait SIGTERM (comme java au lab 0). Avec, « kill 1 » arrête le conteneur.
    command: ["sh", "-c", "trap 'exit 0' TERM; date >> /cache/demarrages; while true; do sleep 1; done"]
    volumeMounts:
    - {name: cache, mountPath: /cache}
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: {drop: ["ALL"]}
  volumes:
  - name: cache
    emptyDir: {}                  # créé vide avec le pod, effacé avec lui
