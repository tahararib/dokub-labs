apiVersion: v1
kind: Service
metadata:
  name: taskboard-lb
spec:
  type: LoadBalancer
  selector: {app: taskboard}
  ports:
  - {port: 80, targetPort: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: taskboard-np
spec:
  type: NodePort
  selector: {app: taskboard}
  ports:
  - {port: 80, targetPort: 8080, nodePort: 30080}
---
apiVersion: v1
kind: Service
metadata:
  name: taskboard-pods
spec:
  clusterIP: None
  selector: {app: taskboard}
  ports:
  - {port: 8080, targetPort: 8080}
