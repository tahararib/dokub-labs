# ============================================================
# État attendu à la fin du lab 2 — appliqué par « dokub lab start 03 »
# Équivalent des objets créés en impératif pendant le lab 2.
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: taskboard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: taskboard
  labels: {app: postgres}
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - {name: POSTGRES_DB, value: taskboard}
        - {name: POSTGRES_USER, value: taskboard}
        - {name: POSTGRES_PASSWORD, value: taskboard}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: taskboard
spec:
  selector: {app: postgres}
  ports:
  - {port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard
  namespace: taskboard
  labels: {app: taskboard}
spec:
  replicas: 3
  selector:
    matchLabels: {app: taskboard}
  template:
    metadata:
      labels: {app: taskboard}
    spec:
      containers:
      - name: taskboard
        image: taskboard:1.0.0
        env:
        - {name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/taskboard"}
        - {name: SPRING_DATASOURCE_USERNAME, value: taskboard}
        - {name: SPRING_DATASOURCE_PASSWORD, value: taskboard}
---
apiVersion: v1
kind: Service
metadata:
  name: taskboard-lb
  namespace: taskboard
spec:
  type: LoadBalancer
  selector: {app: taskboard}
  ports:
  - {port: 80, targetPort: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: taskboard-np
  namespace: taskboard
spec:
  type: NodePort
  selector: {app: taskboard}
  ports:
  - {port: 80, targetPort: 8080, nodePort: 30080}
