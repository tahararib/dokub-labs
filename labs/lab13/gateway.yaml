apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: entree
spec:
  gatewayClassName: cloud-provider-kind
  listeners:
  - name: http
    protocol: HTTP
    port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskboard
spec:
  parentRefs:
  - name: entree                # rattachée à la Gateway « entree »
  hostnames: ["taskboard.local"]  # route choisie par l'en-tête Host
  rules:
  - backendRefs:
    - name: taskboard-lb        # le Service cible
      port: 80
