# ============================================================
# Lab 9 — état attendu en fin de lab (appliqué par « dokub lab start 10 »)
# Lab 7, sans le champ replicas : l'HorizontalPodAutoscaler en a la charge.
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard
  namespace: taskboard
  labels: {app: taskboard}
spec:
  # replicas : absent volontairement. Avec un HPA, un « apply » qui le contient
  # ramènerait le nombre de pods à cette valeur, contre la décision de l'HPA.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                 # un pod en plus à la fois
      maxUnavailable: 0           # jamais moins de 3 pods prêts
  selector:
    matchLabels: {app: taskboard}
  template:
    metadata:
      labels: {app: taskboard}
    spec:
      securityContext:            # niveau du pod : s'applique à TOUS les conteneurs, init compris
        runAsNonRoot: true        # le kubelet refuse de démarrer un conteneur root
        runAsUser: 100            # = « app » dans l'image taskboard (kubectl exec … -- id)
        seccompProfile:
          type: RuntimeDefault    # appels système filtrés par le profil du runtime
      initContainers:
      - name: attente-postgres
        image: postgres:16-alpine
        command:
        - sh
        - -c
        - |
          until pg_isready -h postgres -p 5432; do
            echo "PostgreSQL pas encore prêt"; sleep 2
          done
        securityContext:          # ces deux réglages n'existent qu'au niveau du conteneur
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
      containers:
      - name: taskboard
        image: localhost:5001/taskboard:2.0.0
        ports:
        - containerPort: 8080
        envFrom:                  # chaque clé de la ConfigMap devient une variable (APP_BANNER)
        - configMapRef:
            name: taskboard-config
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres:5432/taskboard"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef: {name: postgres-cred, key: username}
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef: {name: postgres-cred, key: password}
        - name: APP_BANNER_FILE   # prioritaire sur APP_BANNER ; relu à chaque requête
          value: /config/banner.txt
        volumeMounts:
        - name: fichiers
          mountPath: /config
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
        lifecycle:
          preStop:
            sleep:
              seconds: 10         # avant SIGTERM : le temps que tous les nœuds oublient le pod
        startupProbe:
          httpGet: {path: /actuator/health/liveness, port: 8080}
          periodSeconds: 2
          failureThreshold: 60
        readinessProbe:
          httpGet: {path: /actuator/health/readiness, port: 8080}
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /actuator/health/liveness, port: 8080}
          periodSeconds: 10
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 512Mi}
      volumes:
      - name: fichiers            # chaque clé de la ConfigMap devient un fichier dans /config
        configMap:
          name: taskboard-fichiers
