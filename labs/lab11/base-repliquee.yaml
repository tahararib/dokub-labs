# ============================================================
# Lab 11, étape 6 (facultative) — Une base PostgreSQL répliquée, décrite par UN objet.
# Prérequis : l'opérateur CloudNativePG installé (étape 6), qui ajoute le type Cluster.
# Son contrôleur crée les pods, les PVC, les Services (base-rw, base-ro, base-r),
# le Secret base-app (utilisateur et base « app »), la réplication,
# et désigne une nouvelle instance principale si la principale tombe.
# Namespace courant (taskboard) : l'application peut lire le Secret base-app.
# ============================================================
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: base
spec:
  instances: 3            # 1 principale + 2 répliques, en réplication continue
  storage:
    size: 1Gi             # un PVC par instance, classe par défaut (standard)
  # Arrêt de la principale : PostgreSQL attend d'abord que les clients se déconnectent
  # (arrêt « smart »), 180 s par défaut. taskboard garde ses connexions ouvertes :
  # sans ce réglage, la bascule de l'étape 6 attendrait 3 minutes.
  smartShutdownTimeout: 10
